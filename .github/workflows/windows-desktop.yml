name: Windows desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows installers
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/gui/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        working-directory: apps/gui
        run: npm ci

      - name: Test the GUI
        working-directory: apps/gui
        run: npm test

      - name: Verify tagged version
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $config = Get-Content apps/gui/src-tauri/tauri.conf.json | ConvertFrom-Json
          $expected = "v$($config.version)"
          if ($env:RELEASE_TAG -ne $expected) {
            throw "Release tag $env:RELEASE_TAG does not match application version $expected"
          }

      - name: Build Windows bundles
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/gui
          args: --target x86_64-pc-windows-msvc
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Sukaku Forge ${{ github.ref_name }}
          releaseBody: Windows installers built from commit ${{ github.sha }}.
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          retryAttempts: 1
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: sukaku-forge-[version]-windows-[arch]-[bundle]
          releaseAssetNamePattern: sukaku-forge-[version]-windows-[arch][setup].[ext]
