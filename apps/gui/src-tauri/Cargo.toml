[package]
name = "sukaku-forge"
version = "0.1.0"
description = "Native Tauri shell for Sukaku Forge"
edition = "2024"
rust-version = "1.85"
license = "LGPL-2.1-or-later"
build = "build.rs"

[lib]
name = "sukaku_forge_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "sukaku-forge"
path = "src/main.rs"
required-features = ["desktop-runtime"]

[features]
default = ["desktop-runtime"]
tauri-adapter = ["dep:tauri"]
desktop-runtime = ["tauri-adapter", "tauri/default"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
sukaku-forge-app = { path = "../../../crates/app" }
tauri = { version = "=2.11.5", optional = true, default-features = false, features = [] }

[dev-dependencies]
serde_json = "1"

[workspace]
resolver = "3"
