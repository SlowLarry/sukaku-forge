[workspace]
members = [
    "crates/core",
    "crates/engine",
    "crates/classic-rater",
    "crates/presentation",
    "crates/app",
    "crates/wasm-api",
    "crates/cli",
]
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
license = "LGPL-2.1-or-later"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Maximum-throughput portable profile for the dedicated rating-only binary.
# Host CPU tuning is an explicit Make target so benchmark results and release
# artifacts cannot accidentally mix portable and native builds.
[profile.rater]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
