[workspace]
members = [
    "crates/core",
    "crates/engine",
    "crates/presentation",
    "crates/app",
    "crates/wasm-api",
    "crates/cli",
]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
license = "LGPL-2.1-or-later"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
